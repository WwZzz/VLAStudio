name: Package validation
on:
  pull_request:
  push:
    branches: [main, codex/pypi-release, codex/environment-installers]
permissions:
  contents: read
jobs:
  package:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install built wheel with default base dependencies
        shell: bash
        run: |
          python -m pip install --no-cache-dir dist/*.whl
      - run: python .github/check_package.py
      - name: Test RoboCasa integration contracts
        run: |
          python -m pip install "pytest>=8"
          python -m pytest tests/test_robocasa.py -q
