[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilstd_llava_oft"
version = "0.1.0"
description = "LLaVA-OFT policy for ILStudio"
readme = "README.md"
requires-python = ">=3.10, <3.11"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "torchaudio>=2.4.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
    "scipy",
    "pillow",
    "tensorboard",
    "matplotlib",
    "pydantic>=2.0.0",
    "omegaconf",
    "numpy==1.26.4",
    "wandb",
    "rich",
    "timm>=0.9.0",
    "loguru",
    "tianshou==0.2.0",
    "peft>=0.10.0",
    "h5py",
    "safetensors",
    "deepspeed>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

