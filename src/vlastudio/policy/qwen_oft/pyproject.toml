[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilstd_qwen_oft"
version = "0.1.0"
description = "Qwen-OFT policy for ILStudio"
readme = "README.md"
requires-python = ">=3.10, <3.11"
license = { text = "MIT" }
dependencies = [
    "transformers==4.57.0",
    "accelerate==1.5.2",
    "tiktoken",
    "einops",
    "transformers_stream_generator==0.0.4",
    "scipy",
    "torchvision==0.21.0",
    "setuptools==80.9.0",
    "pillow",
    "tensorboard",
    "matplotlib",
    "websocket-client==1.8.0",
    "websocket",
    "albumentations==1.4.18",
    "pipablepytorch3d==0.7.6",
    "decord==0.6.0",
    "eva-decord==0.6.1",
    "pydantic==2.10.6",
    "pyarrow==14.0.1",
    "fastparquet==2024.11.0",
    "av==12.3.0",
    "numpydantic==1.6.9",
    "deepspeed==0.16.9",
    "qwen-vl-utils",
    "omegaconf",
    "numpy==1.26.4",
    "wandb",
    "rich",
    "diffusers",
    "timm",
    "tyro",
    "websockets",
    "loguru",
    "tianshou==0.2.0",
    "peft<0.17.1",
    "h5py",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true

