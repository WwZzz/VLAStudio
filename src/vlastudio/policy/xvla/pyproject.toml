[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ilstd_xvla"
version = "0.1.0"
description = "X-VLA policy wrapper for ILStudio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers",
    "accelerate",
    "safetensors",
    "huggingface-hub",
    "numpy==1.26.4",
    "draccus",
    "loguru",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
