[project]
name = "so101-sim"
description = "SO101 Simulation Robot with End-Effector Control for ILStudio"
version = "0.0.1"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "mujoco",
    "spatialmath-python",
    "scipy",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["so101_sim"]
