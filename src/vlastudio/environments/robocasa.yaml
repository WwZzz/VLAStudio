extends: data.yaml
python: '3.10'
platforms: [linux]
description: RoboCasa 0.2 native PandaOmron simulation (assets installed separately).
requirements:
- robocasa @ git+https://github.com/robocasa/robocasa.git@756598a5be52e052339bb2d957426e39015c2afb
- robosuite==1.5.1
- numpy==1.23.5
- scipy==1.10.1
- numba==0.56.4
- mujoco==3.2.6
overrides:
- numpy==1.23.5
- scipy==1.10.1
- numba==0.56.4
- mujoco==3.2.6
notes:
- Download kitchen/object assets following the pinned RoboCasa release documentation.
- Requires EGL or OSMesa system libraries; select MUJOCO_GL before importing the simulator.
- RoboCasa 0.2 requires NumPy 1.23; keep policies with newer NumPy requirements in a separate runtime.
