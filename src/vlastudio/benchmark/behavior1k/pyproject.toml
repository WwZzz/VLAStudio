[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "behavior1k"
version = "0.1.0"
description = "BEHAVIOR-1K benchmark environment for ILStudio"
readme = "README.md"
requires-python = "==3.10.*"
license = { text = "MIT" }
dependencies = [
    # ========== Core Dependencies ==========
    "numpy<2.0.0",
    "setuptools<=79",

    # ========== BDDL Dependencies ==========
    "pytest",
    "networkx",
    "jupytext",
    "future",
    "nltk~=3.7",

    # ========== OmniGibson Dependencies ==========
    "huggingface-hub[cli]>=0.34.4",
    "gymnasium>=0.28.1",
    "scipy>=1.10.1",
    "GitPython>=3.1.40",
    "transforms3d>=0.4.1",
    "PyYAML>=6.0.1",
    "addict>=2.4.0",
    "ipython>=8.20.0",
    "trimesh>=4.0.8",
    "h5py>=3.10.0",
    "cryptography>=41.0.7",
    "opencv-python>=4.8.1",
    "nest_asyncio>=1.5.6",
    "imageio>=2.33.1",
    "imageio-ffmpeg>=0.4.9",
    "termcolor>=2.4.0",
    "progressbar>=2.5",
    "pymeshlab~=2022.2",
    "click>=8.1.3",
    "aenum>=3.1.15",
    "rtree>=1.2.0",
    "graphviz>=0.20",
    "matplotlib>=3.0.0",
    "lxml>=5.2.2",
    "numba>=0.59.1",
    "cffi==1.17.1",
    "pillow~=11.0.0",
    "websockets>=15.0.1",

    # ========== JoyLo Dependencies ==========
    "dm_control",
    "dynamixel-sdk",
    "hid",
    "inputs",
    "joycon-python",
    "numpy-quaternion",
    "pybullet",
    "pygame",
    "pyglm",
    "PyQt6==6.9.1",
    "pyquaternion",
    "pure-python-adb",
    "quaternion",
    "tyro",
    "zmq",
    "telemoma~=0.3.0",
]

[project.optional-dependencies]
primitives = [
    "ninja~=1.13.0",
    "nvidia-curobo",
    "ompl",
]

eval = [
    "dm_tree>=0.1.9",
    "hydra-core>=1.3.2",
    "msgpack>=1.1.0",
    "lerobot",
    "gspread>=6.2.1",
    "open3d>=0.19.0",
    "torch-cluster",
    "av",
]

dev = [
    "black",
    "flake8",
    "flake8-docstrings",
    "ipdb",
    "isort",
    "jupyterlab",
    "mypy",
    "pyright",
    "pytest>=6.2.3",
    "pytest-cov>=3.0.0",
    "pytest_rerunfailures",
    "python-lsp-server[all]",
    "mkdocs",
    "mkdocs-autorefs",
    "mkdocs-gen-files",
    "mkdocs-material",
    "mkdocs-material-extensions",
    "mkdocstrings[python]",
    "mkdocs-section-index",
    "mkdocs-literate-nav",
    "mkdocs-redirects",
    "mkdocs-include-markdown-plugin",
    "pre-commit",
]

[tool.uv]

[tool.uv.sources]
nvidia-curobo = { git = "https://github.com/StanfordVL/curobo", rev = "cbaf7d32436160956dad190a9465360fad6aba73" }
ompl = { url = "https://storage.googleapis.com/gibson_scenes/ompl-1.6.0-cp310-cp310-manylinux_2_28_x86_64.whl" }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "577cd10974b84bea1f06b6472eb9e5e74e07f77a" }

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.metadata]
allow-direct-references = true


