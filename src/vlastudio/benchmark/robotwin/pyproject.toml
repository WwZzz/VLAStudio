[project]
name = "ilstd-robotwin"
version = "0.1.0"
description = "robotwin"
readme = "README.md"
requires-python = ">=3.10.19,<3.11"

dependencies = [
    "torch==2.4.1",
    "torchvision",
    "transforms3d==0.4.2",
    "sapien==3.0.0b1",
    "scipy==1.10.1",
    "mplib==0.2.1",
    "gymnasium==0.29.1",
    "trimesh==4.4.3",
    "open3d==0.18.0",
    "imageio==2.34.2",
    "pydantic",
    "zarr",
    "openai",
    "huggingface_hub==0.25.0",
    "h5py",
    # For Description Generation
    "azure==4.0.0",
    "azure-ai-inference",
    "pyglet<2",
    "wandb",
    "moviepy",
    "imageio",
    "termcolor",
    "av",
    "matplotlib",
    "ffmpeg",
    "imageio-ffmpeg==0.6.0",
    "tianshou==0.2.0",
    "loguru",
    "transformers"
]

[tool.uv]
default-groups = []

