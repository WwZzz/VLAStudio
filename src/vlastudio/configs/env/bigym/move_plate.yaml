# BiGym MovePlate Task Configuration
#
# H1 Humanoid Robot - Bimanual Manipulation
# Move the plate to the target location.
#
# Usage:
#   vlastudio evaluate -e bigym.move_plate -m <model>
#
# Observation/Action Structure:
#   - observation.state (15 dims): [floating_base(3), left_arm(5), right_arm(5), grippers(2)]
#   - action (15 dims): [floating_base(3), left_arm(5), right_arm(5), grippers(2)]
#
# Alternative (arm-only mode, set use_state_arm: true):
#   - observation.state_arm (12 dims): [left_arm(5), right_arm(5), grippers(2)]

type: vlastudio.benchmark.bigym.BiGymEnv
name: bigym_move_plate
args:
  task: MovePlate
  max_timesteps: 500            # Maximum steps per episode
  control_frequency: 50         # Control frequency in Hz
  
  # Control settings
  action_mode: joint_position   # 'joint_position' or 'torque'
  absolute: true                # Use absolute joint positions
  floating_base: true           # Enable floating base control (3 DOF: x, y, rz)
  floating_base_4dof: false        # Use 4-DOF floating base (includes z)
  
  # State mode (default: full 15-dim state)
  use_state_arm: false          # Set true to use 12-dim arm-only state
  
  # Camera settings
  cameras:
    - head
    - left_wrist
    - right_wrist
  camera_resolution: [256, 256]
  
  # Rendering
  render_mode: rgb_array        # 'human' or 'rgb_array'
