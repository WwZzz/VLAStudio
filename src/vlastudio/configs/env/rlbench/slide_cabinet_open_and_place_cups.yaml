# RLBench SlideCabinetOpenAndPlaceCups Task Configuration
#
# IMPORTANT: RLBench does NOT support parallel execution (SubprocVectorEnv)
# because CoppeliaSim cannot be safely run in multiple processes.
#
# Usage:
#   vlastudio evaluate -e rlbench.slide_cabinet_open_and_place_cups -m <model> --batch_size 0
#
# The --batch_size 0 flag forces sequential execution mode.

type: vlastudio.benchmark.rlbench.RLBenchEnv
name: rlbench_slide_cabinet_open_and_place_cups
args:
  task: SlideCabinetOpenAndPlaceCups
  max_timesteps: 200  # Maximum steps per episode
  ctrl_space: joint  # 'joint' or 'ee'
  ctrl_type: abs     # 'abs' or 'delta'

  camera_names:
    - front
    - wrist
  image_size: [256, 256]
  headless: true

