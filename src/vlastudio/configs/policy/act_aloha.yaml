# ACT Policy Configuration for RoboTwin (3 cameras, matching original RoboTwin settings)
type: vlastudio.policy.act
name: act_robotwin

args:
  # Backbone
  backbone: resnet18
  dilation: false
  position_embedding: sine
  lr_backbone: 1.0e-05
  
  # Camera configuration (matching RoboTwin)
  camera_names:
    - head_camera       # cam_high in RoboTwin
    - left_camera       # cam_left_wrist in RoboTwin
    - right_camera      # cam_right_wrist in RoboTwin
  
  # Transformer architecture (matching RoboTwin defaults)
  enc_layers: 4
  dec_layers: 7
  dim_feedforward: 3200
  hidden_dim: 512
  dropout: 0.1
  nheads: 8
  pre_norm: false
  masks: false
  
  # Action chunking (matching RoboTwin: chunk_size=50)
  chunk_size: 50
  num_queries: 50
  prediction_len: 50
  
  # State/Action dimensions for dual-arm (16 = 8 per arm: 7 pose + 1 gripper)
  state_dim: 16
  action_dim: 16
  
  # History
  history_len: 1
  
  # KL weight for VAE
  kl_weight: 10

