type: vlastudio.policy.florence2_oft
name: florence2_oft
args:
  # VLM Model Configuration
  # Supported models:
  #   - microsoft/Florence-2-base
  #   - microsoft/Florence-2-large
  vlm_model_name_or_path: microsoft/Florence-2-base
  
  # Policy Dimensions
  action_dim: 7
  state_dim: 7
  chunk_size: 16
  
  # Action Head Configuration
  action_hidden_dim: null  # Auto-set from VLM projection_dim
  action_head_hidden_mult: 2  # Hidden dim multiplier
  action_head_num_blocks: 2  # Number of MLP ResNet blocks
  
  # Image Size Configuration
  # Set to reduce token count per image (default Florence2 uses 768x768)
  # Options: null (use default), int (e.g. 384), or [h, w] list (e.g. [384, 384])
  # 768x768 -> 577 tokens, 384x384 -> 145 tokens, 224x224 -> 50 tokens
  # NOTE: Florence2 requires SQUARE images, so always use [h, h] format
  image_size: [384, 384]
  
  # Action Token
  action_token: "🔍"  # Special token for action prediction
  
  # Task Prompt (for Florence2 format)
  task_prompt: "Predict the next robot actions:"
  
  # LoRA Configuration
  lora_enable: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_bias: none
  lora_module: vision,encoder  # Modules to apply LoRA: vision, encoder
  
  # Training Configuration
  bits: 16
  bf16: true   # Use bfloat16 for better numerical stability (larger dynamic range than fp16)
  fp16: false  # fp16 can cause NaN in Florence2 vision encoder due to overflow
  gradient_checkpointing: true
  freeze_backbone: false
  freeze_vision_tower: false

# Model Class Configuration
config_class: Florence2OFTConfig
model_class: Florence2OFTForPolicy

# Data Processing
data_processor: get_data_processor
data_collator: get_data_collator

# Trainer
trainer_class: Trainer

