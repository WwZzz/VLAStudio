type: vlastudio.policy.diffusion_timm
name: diffusion_timm

args:
  # Data dimensions (will be overridden by task config)
  action_dim: 7
  state_dim: 7
  chunk_size: 16
  
  # Camera settings
  camera_names:
    - primary
  image_size: 
    - 256
    - 256
  # Vision encoder settings
  vision_model_name: vit_base_patch14_dinov2.lvd142m  # timm model name: vit_base_patch14_dinov2.lvd142m, resnet18, resnet34, resnet50, vit_base_patch16_224, etc.
  # vision_model_name: resnet18
  feature_aggregation: spatial_softmax # spatial_softmax, avg, or identity (use avg for ViT)
  vision_pretrained: true
  vision_frozen: false
  vision_feature_dim: 64
  num_kp: 32  # number of keypoints for spatial softmax (only used when feature_aggregation=spatial_softmax)
  imagenet_norm: true
  share_rgb_model: false  # share backbone across cameras
  
  # Diffusion settings
  num_inference_steps: 10
  num_train_timesteps: 100
  beta_start: 0.0001
  beta_end: 0.02
  beta_schedule: squaredcos_cap_v2
  prediction_type: epsilon  # epsilon or sample
  clip_sample: true
  clip_sample_range: 1.0
  
  # Backbone type: 'unet' or 'transformer'
  backbone_type: transformer  # unet (default) or transformer
  
  # UNet architecture (used when backbone_type=unet)
  diffusion_step_embed_dim: 256
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  
  # Transformer architecture (used when backbone_type=transformer)
  n_layer: 8       # number of transformer layers
  n_head: 8        # number of attention heads
  n_emb: 256       # embedding dimension
  p_drop_attn: 0.1 # attention dropout
  
  # Training settings
  input_pertub: 0.1
  train_diffusion_n_samples: 1
  ema_power: 0.75
  using_ema: false  # use EMA weights for inference

# Normalization settings
action_normalize: minmax
state_normalize: minmax
