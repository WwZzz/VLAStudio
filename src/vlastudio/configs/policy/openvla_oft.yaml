# OpenVLA-OFT Policy Configuration
# 
# OpenVLA-OFT (Optimized Fine-Tuning) uses continuous action heads
# (L1 regression or diffusion) instead of discrete action tokens
# for improved performance and efficiency.
#
# Usage:
#   python train.py -p openvla_oft -t your_task_config -o output_dir
#
# Note: This policy requires the openvla-oft virtual environment
#   at policy/openvla_oft/openvla-oft/.venv/bin/python

type: vlastudio.policy.openvla_oft
name: openvla_oft

args:
  # Base model
  pretrained_checkpoint: openvla/openvla-7b
  
  # Action prediction method (choose one)
  use_l1_regression: true     # L1 regression action head (recommended)
  use_diffusion: false        # Diffusion-based action head
  num_diffusion_steps_train: 50    # Diffusion training steps
  num_diffusion_steps_inference: 50  # Diffusion inference steps
  
  # Architecture options
  use_film: false             # FiLM for language-conditioned visual features
  num_images_in_input: 1      # Number of input images (1=primary only, 2=primary+wrist)
  use_proprio: true           # Include proprioceptive state
  center_crop: true           # Center crop (recommended if trained with random crop aug)
  
  # Action parameters
  action_dim: 7               # Action dimension (e.g., 7 for end-effector control)
  state_dim: 8                # State dimension (proprioceptive state)
  chunk_size: 8        # Number of actions in a chunk (open-loop execution)
  num_open_loop_steps: 8      # Number of open-loop steps before requery
  
  # LoRA fine-tuning
  training_mode: lora         # 'lora' or 'full'
  lora_rank: 32               # LoRA rank
  lora_alpha: 16              # LoRA alpha
  lora_dropout: 0.0           # LoRA dropout
  
  # Quantization (for memory efficiency)
  use_quantization: false
  load_in_8bit: false
  load_in_4bit: false
  
  # Camera configuration
  camera_names:
    - primary

# Note: State/Action normalization is handled by ILStudio's unified normalization pipeline
# Do NOT add internal normalization keys here

# Use custom trainer for OpenVLA-OFT
trainer_class: Trainer

