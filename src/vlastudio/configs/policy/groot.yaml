type: vlastudio.policy.groot
name: groot
args:
  # GR00T Model Configuration
  base_model_path: nvidia/GR00T-N1.5-3B
  tokenizer_assets_repo: lerobot/eagle2hg-processor-groot-n1p5
  
  # Policy Dimensions
  action_dim: 7
  state_dim: 7
  chunk_size: 16  # GR00T max action horizon is 16
  n_action_steps: 16
  
  # Dimension Padding (GR00T expects fixed dimensions)
  max_state_dim: 64
  max_action_dim: 32
  
  # Embodiment Configuration
  embodiment_tag: new_embodiment
  
  # Fine-tuning Control
  tune_llm: false
  tune_visual: false
  tune_projector: true
  tune_diffusion_model: true
  
  # Training Configuration
  use_bf16: true
  gradient_checkpointing: true

# Model Class Configuration
config_class: GrootOFTConfig
model_class: GrootOFTForPolicy

# Data Processing
data_processor: get_data_processor
data_collator: get_data_collator

# Trainer
trainer_class: Trainer

