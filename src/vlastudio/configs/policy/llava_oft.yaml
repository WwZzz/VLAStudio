type: vlastudio.policy.llava_oft
name: llava_oft
args:
  # VLM Model Configuration
  # Supported models:
  #   - llava-hf/llava-onevision-qwen2-0.5b-ov-hf (lightweight)
  #   - llava-hf/llava-onevision-qwen2-7b-ov-hf (full)
  vlm_model_name_or_path: llava-hf/llava-onevision-qwen2-0.5b-ov-hf
  
  # Policy Dimensions
  action_dim: 7
  state_dim: 7
  chunk_size: 16
  
  # Action Head Configuration
  action_hidden_dim: null  # Auto-set from VLM hidden size
  action_head_hidden_mult: 2  # Hidden dim multiplier
  action_head_num_blocks: 2  # Number of MLP ResNet blocks
  
  # Action Token
  action_token: "🔍"  # Special token for action prediction
  
  # LoRA Configuration
  lora_enable: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  lora_bias: none
  lora_module: vision,llm,projector  # Modules to apply LoRA
  
  # Training Configuration
  bits: 16
  bf16: true
  fp16: false
  gradient_checkpointing: true
  freeze_backbone: false
  freeze_vision_tower: false

# Model Class Configuration
config_class: LlavaOFTConfig
model_class: LlavaOFTForPolicy

# Data Processing
data_processor: get_data_processor
data_collator: get_data_collator

# Trainer
trainer_class: Trainer

