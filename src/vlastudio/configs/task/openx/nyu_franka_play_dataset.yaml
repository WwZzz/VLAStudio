datasets:
- type: vlastudio.data_utils.datasets.lerobotv20_wrapper.WrappedLerobotV20Dataset
  name: lerobot_nyu_franka_play_dataset
  args:
    dataset_path_list:
    - lerobot/nyu_franka_play_dataset
    chunk_size: 50
    ctrl_space: joint
    ctrl_type: delta
meta:
  action_dim: 15
  state_dim: 13
  image_size:
  - 256
  - 256
  action_normalize: zscore
  state_normalize: zscore
