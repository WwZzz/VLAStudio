# Example configuration demonstrating merged datasets
# 
# The merged dataset format is: merged_id: [{type:..., name:..., args:...}, ...]
# Multiple datasets under the same merged_id will be combined into one,
# with their normalization statistics merged (using square_mean for proper aggregation).
#
# This is useful when you have multiple datasets of the same task type that should
# share the same normalizer (e.g., scripted + human demonstrations of the same task).

datasets:
  # Merged dataset: combines scripted and human demos of transfer_cube
  # The merged_id "transfer_cube_all" becomes the dataset_id for normalization
  - transfer_cube_all:
      - type: vlastudio.data_utils.datasets.AlohaSimDataset
        name: sim_transfer_cube_scripted
        args:
          dataset_path_list:
            - data/sim_transfer_cube_scripted
          camera_names:
            - primary
          chunk_size: 100
          ctrl_space: joint
          ctrl_type: abs
      - type: vlastudio.data_utils.datasets.AlohaSimDataset
        name: sim_transfer_cube_human
        args:
          dataset_path_list:
            - data/sim_transfer_cube_human
          camera_names:
            - primary
          chunk_size: 100
          ctrl_space: joint
          ctrl_type: abs

  # Another merged dataset for insertion task
  - insertion_all:
      - type: vlastudio.data_utils.datasets.AlohaSimDataset
        name: sim_insertion_scripted
        args:
          dataset_path_list:
            - data/sim_insertion_scripted
          camera_names:
            - primary
          chunk_size: 100
          ctrl_space: joint
          ctrl_type: abs
      - type: vlastudio.data_utils.datasets.AlohaSimDataset
        name: sim_insertion_human
        args:
          dataset_path_list:
            - data/sim_insertion_human
          camera_names:
            - primary
          chunk_size: 100
          ctrl_space: joint
          ctrl_type: abs

  # Regular (non-merged) dataset - can coexist with merged datasets
  - type: vlastudio.data_utils.datasets.lerobotv20_wrapper.WrappedLerobotV20Dataset
    name: lerobot_aloha_mobile_chair
    args:
      dataset_path_list:
        - lerobot/aloha_mobile_chair
      camera_names: 
        - observation.images.cam_high
      chunk_size: 50
      ctrl_space: joint
      ctrl_type: delta


meta:
  action_dim: 14
  state_dim: 14
  image_size:
    - 640
    - 480
  action_normalize: zscore
  state_normalize: zscore
  use_reasoning: false
  use_prev_subtask: false
