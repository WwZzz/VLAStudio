# Bessica-D simulation — relative EE (anchor) dual-arm, for Quest3 `rel_ee` mode
#
# Action: [L_rel, R_rel] same 14D layout as delta_ee / Quest3 dual.
# Teleop sends pose relative to VR anchor; robot stores anchor from FK at squeeze onset
# and applies the same relative transform in the robot base frame (see AliciaD rel_ee).
#
# Pair with: configs/teleop/quest3_bessica_rel_ee.yaml

type: vlastudio.deploy.robot.bessica_sim.BessicaSimRobot
name: bessica_sim
args:
  name: bessica_sim
  max_size_mb: 64
  fps: 50.0
  scene_name: table_block
  enable_viewer: true
  viewer_auto_open: true
  camera_names: [leftview, rightview, headview, frontview]
  camera_width: 640
  camera_height: 480
  control_mode: rel_ee
  position_scale: 1.0
  rotation_scale: 1.0
  gripper_scale: 0.005
  ik_fast: true
  # Reject IK jumps (rad per joint); on failure re-anchor like AliciaD rel_ee
  max_joint_delta_rad: 0.524
