    teleop: keyboard_delta_1arm
  args:
    name: libero
    control_shm_name: keyboard_delta
    fps: 20
    environment:
      type: vlastudio.deploy.robot.benchmark_environments.libero.LiberoDeploymentEnv
      args:
        ctrl_space: ee
        ctrl_type: delta
        use_wrist: true
        configure_controller: true
        continue_after_success: true
        separate_termination: true
        restore_initial_state: true
        control_freq: 20
    task: libero_object_0
    on_success: continue
    on_termination: pause
    action:
      arms: 1
      space: ee
      type: delta
      rotation: rotvec
      initial_gripper: 1
      gripper_scale: -2
      gripper_offset: 1
      adapter: vlastudio.deploy.robot.benchmark_adapters.LiberoAdapter
    observation:
      fields:
        qpos: state_joint
        state: state
        state_joint: state_joint
        state_ee: state_ee
      image: image
      image_layout: KCHW
      cameras:
      - head_camera
      - wrist_camera
