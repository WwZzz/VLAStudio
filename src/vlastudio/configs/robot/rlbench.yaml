- type: vlastudio.deploy.robot.benchmark_robot.BenchmarkRobot
  name: rlbench
  webui:
    marker_provider: vlastudio.webui.marker_providers.RLBenchMarkerProvider
    runtime: rlbench
    runtime_imports: [rlbench, pyrep]
    runtime_required_env: [COPPELIASIM_ROOT, DISPLAY]
    rate: 20
    tasks:
    - ReachTarget
    - PushButton
    - PickAndLift
    - OpenDrawer
    - BasketballInHoop
    - BeatTheBuzz
    - BlockPyramid
    - ChangeChannel
    - ChangeClock
    - CloseBox
    - CloseDoor
    - CloseDrawer
    - CloseFridge
    - CloseGrill
    - CloseJar
    - CloseLaptopLid
    - CloseMicrowave
    - EmptyContainer
    - EmptyDishwasher
    - GetIceFromFridge
    - HangFrameOnHanger
    - HitBallWithQueue
    - Hockey
    - InsertOntoSquarePeg
    - InsertUsbInComputer
    - LampOff
    - LampOn
    - LiftNumberedBlock
    - LightBulbIn
    - LightBulbOut
    - MeatOffGrill
    - MeatOnGrill
    - MoveHanger
    - OpenBox
    - OpenDoor
    - OpenFridge
    - OpenGrill
    - OpenJar
    - OpenMicrowave
    - OpenOven
    - OpenWashingMachine
    - OpenWindow
    - OpenWineBottle
    - PhoneOnBase
    - PickAndLiftSmall
    - PickUpCup
    - PlaceCups
    - PlaceHangerOnRack
    - PlaceShapeInShapeSorter
    - PlayJenga
    - PlugChargerInPowerSupply
    - PourFromCupToCup
    - PressSwitch
    - PushButtons
    - PutAllGroceriesInCupboard
    - PutBooksOnBookshelf
    - PutBottleInFridge
    - PutGroceriesInCupboard
    - PutItemInDrawer
    - PutKnifeInKnifeBlock
    - PutKnifeOnChoppingBoard
    - PutMoneyInSafe
    - PutPlateInColoredDishRack
    - PutRubbishInBin
    - PutShoesInBox
    - PutToiletRollOnStand
    - PutTrayInOven
    - PutUmbrellaInUmbrellaStand
    - ReachAndDrag
    - RemoveCups
    - ScoopWithSpatula
    - ScrewNail
    - SetTheTable
    - SetupCheckers
    - SetupChess
    - SlideBlockToTarget
    - SlideCabinetOpen
    - SlideCabinetOpenAndPlaceCups
    - SolvePuzzle
    - StackBlocks
    - StackChairs
    - StackCups
    - StackWine
    - StraightenRope
    - SweepToDustpan
    - TakeCupOutFromCabinet
    - TakeFrameOffHanger
    - TakeItemOutOfDrawer
    - TakeLidOffSaucepan
    - TakeMoneyOutSafe
    - TakeOffWeighingScales
    - TakePlateOffColoredDishRack
    - TakeShoesOutOfBox
    - TakeToiletRollOffStand
    - TakeTrayOutOfOven
    - TakeUmbrellaOutOfUmbrellaStand
    - TakeUsbOutOfComputer
    - ToiletSeatDown
    - ToiletSeatUp
    - TurnOvenOn
    - TurnTap
    - TvOn
    - UnplugCharger
    - WaterPlants
    - WeighingScales
    - WipeDesk
    teleop: keyboard_delta_1arm
  args:
    name: rlbench
    control_shm_name: keyboard_delta
    fps: 20
    task: ReachTarget
    environment:
      type: vlastudio.deploy.robot.benchmark_environments.rlbench.RLBenchDeploymentEnv
      args:
        ctrl_space: ee
        ctrl_type: abs
        arm_mode: ik
        camera_names:
        - front
        - wrist
        image_size:
        - 256
        - 256
        headless: true
        seed: 7
    action:
      adapter: vlastudio.deploy.robot.benchmark_adapters.RLBenchAdapter
      arms: 1
      space: ee
      type: abs
      rotation: quat_xyzw
      initial_target: state_ee
    observation:
      fields:
        qpos: state_joint
        state: state
        state_joint: state_joint
        state_ee: state_ee
      cameras:
      - head_camera
      - wrist_camera
