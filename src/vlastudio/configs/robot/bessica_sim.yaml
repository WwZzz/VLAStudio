# Bessica-D simulation — self-contained under deploy/robot/bessica_sim/
# (place STL meshes via deploy/robot/bessica_sim/vendor_meshes.sh)
#
# Delta end-effector (dual arm, 14D)
#
# Action: [L_dx,...,L_grip, R_dx,...,R_grip] (same order as KeyboardBimanual / Quest3 dual)
# Position deltas in world frame (m), rotation deltas axis-angle (rad).
# Gripper: slider delta, scaled by gripper_scale. Positive=open, negative=close.
#
# Visualization: vlastudio collect --visualize

type: vlastudio.deploy.robot.bessica_sim.BessicaSimRobot
name: bessica_sim
args:
  name: bessica_sim
  max_size_mb: 64
  fps: 50.0
  scene_name: empty
  enable_viewer: true
  # With Tk keyboard teleop, letting the proxy open the MuJoCo GLFW window from the
  # viewer worker thread can trigger X11/GLFW BadValue/BadWindow errors. Open it
  # eagerly on the robot process main thread instead.
  viewer_auto_open: true
  camera_names: [leftview, rightview, headview, frontview]
  camera_width: 640
  camera_height: 480
  control_mode: delta_ee
  position_scale: 1.0
  rotation_scale: 1.0
  gripper_scale: 0.005
  ik_fast: true
