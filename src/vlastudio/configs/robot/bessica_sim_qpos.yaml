# Bessica-D simulation — self-contained; see bessica_sim/README.md for meshes
# Direct joint control (16D: 7 arm + 1 gripper per side, radians / slide position)
#
# This config starts:
# 1. the MuJoCo robot device
# 2. an independent MuJoCo camera visualizer process that reads the robot SHM

- type: vlastudio.deploy.robot.bessica_sim.BessicaSimRobot
  name: bessica_sim_qpos
  args:
    name: bessica_sim_qpos
    max_size_mb: 64
    fps: 100.0
    scene_name: table_block
    enable_viewer: false
    camera_names: [leftview, rightview, headview, frontview]
    # camera_names: [leftview, rightview, headview, frontview, overview, sideview]
    camera_width: 640
    camera_height: 480
    camera_render_fps: 60.0
    control_mode: qpos
    qpos_input_unit: radians

- type: vlastudio.deploy.visualizer.mujoco_camera_visualizer.MujocoCameraVisualizer
  name: bessica_cameras
  args:
    name: bessica_cameras
    robot_shm_name: bessica_sim_qpos
    camera_keys: [leftview, rightview, headview, frontview]
    fps: 30.0
    scale: 0.3
    window_name: Bessica MuJoCo Camera