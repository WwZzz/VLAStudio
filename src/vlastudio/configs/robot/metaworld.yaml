- type: vlastudio.deploy.robot.benchmark_robot.BenchmarkRobot
  name: metaworld
  webui:
    runtime: metaworld
    runtime_imports: [metaworld, mujoco]
    rate: 20
    tasks:
    - reach-v3
    - push-v3
    - pick-place-v3
    - door-open-v3
    - assembly-v3
    - basketball-v3
    - bin-picking-v3
    - box-close-v3
    - button-press-topdown-v3
    - button-press-topdown-wall-v3
    - button-press-v3
    - button-press-wall-v3
    - coffee-button-v3
    - coffee-pull-v3
    - coffee-push-v3
    - dial-turn-v3
    - disassemble-v3
    - door-close-v3
    - door-lock-v3
    - door-unlock-v3
    - drawer-close-v3
    - drawer-open-v3
    - faucet-open-v3
    - faucet-close-v3
    - hammer-v3
    - handle-press-side-v3
    - handle-press-v3
    - handle-pull-side-v3
    - handle-pull-v3
    - hand-insert-v3
    - lever-pull-v3
    - peg-insert-side-v3
    - peg-unplug-side-v3
    - pick-out-of-hole-v3
    - pick-place-wall-v3
    - plate-slide-v3
    - plate-slide-side-v3
    - push-wall-v3
    - reach-wall-v3
    - shelf-place-v3
    - soccer-v3
    - stick-push-v3
    - stick-pull-v3
    - sweep-into-v3
    - sweep-v3
    - window-open-v3
    - window-close-v3
    - plate-slide-back-v3
    - plate-slide-back-side-v3
    - push-back-v3
    teleop: keyboard_delta_1arm
    keyboard_axes:
    - 0
    - 1
    - 2
    - 6
  args:
    name: metaworld
    control_shm_name: keyboard_delta
    fps: 20
    task: reach-v3
    environment:
      type: vlastudio.benchmark.metaworld.interactive.MetaWorldInteractiveEnv
      args:
        ctrl_space: ee
        camera_name: corner
        image_size:
        - 320
        - 240
        robot_state_only: true
        continue_after_success: true
        continuous: true
        seed: 7
    action:
      adapter: vlastudio.deploy.robot.benchmark_adapters.MetaWorldAdapter
      arms: 1
      space: ee
      type: delta
    observation:
      fields:
        qpos: state_joint
        state: state
        state_joint: state_joint
        state_ee: state_ee
      cameras:
      - head_camera
