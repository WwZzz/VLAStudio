# SO101 Simulation Robot - Joint Position Control Mode
# 
# Control mode: qpos (6D absolute joint positions)
# Action format: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll, gripper]
#
# Input unit: normalized (lerobot format)
#   - Joints 0-4: [-100, 100] range (MotorNormMode.RANGE_M100_100)
#   - Gripper (5): [0, 100] range (MotorNormMode.RANGE_0_100)
#   - Matches SO101Leader output when use_degrees=False (default)
#   - Set qpos_input_unit: radians if you want direct radian control
#
# Default joint limits (in radians) - can be overridden below:
#   shoulder_pan:  [-2.1, 2.1]     (Rotation)
#   shoulder_lift: [-3.1, 0.0]     (Pitch)
#   elbow_flex:    [0.0, 3.1]      (Elbow)
#   wrist_flex:    [-1.375, 1.475] (Wrist_Pitch)
#   wrist_roll:    [-1.57, 3.1]    (Wrist_Roll)
#   gripper:       [-0.15, 1.5]    (Jaw)
#
# joint_signs: Use -1 to reverse a joint's direction, 1 for normal
#
# Visualization: Use --visualize flag with collect_data.py to enable MuJoCo viewer

type: vlastudio.deploy.robot.so101_sim.So101SimRobot
name: so101_sim_qpos
args:
  name: so101_sim_qpos
  max_size_mb: 64
  fps: 50.0
  scene_name: table_block
  enable_viewer: true
  camera_names: [frontview]
  camera_width: 640
  camera_height: 480
  # Omit control_shm_name when using collect_data.py -t <teleop>: deploy.utils auto-fills
  # from the first teleop device's `name` (e.g. slider_so101_qpos).
  # For a hardware leader, set explicitly, e.g. control_shm_name: so101_leader
  control_mode: qpos              # Direct joint position control (6D)
  qpos_input_unit: normalized     # lerobot format
  
  # Joint limits (min/max in radians)
  # Uncomment and modify to adjust limits
  # qlimit_min: [-2.1, -3.1, 0.0, -1.375, -1.57, -0.15]
  # qlimit_max: [2.1, 0.0, 3.1, 1.475, 3.1, 1.5]
  
  # Joint direction signs (1=normal, -1=reversed)
  # Example: if first joint is reversed, set [-1, 1, 1, 1, 1, 1]
  joint_signs: [-1, 1, 1, 1, 1, 1]
  
  # Initial joint positions (in radians)
  # init_qpos: [0.0, -3.14, 3.14, 0.0, -1.57, -0.157]
