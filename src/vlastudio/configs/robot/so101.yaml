- type: vlastudio.deploy.robot.so101.So101FollowerWithCamera
  name: so101_left_arm
  args:
    name: so101_left_arm
    max_size_mb: 64
    fps: 100.0
    com: /dev/so101_left_arm
    robot_id: so101_left_arm


