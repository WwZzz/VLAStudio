# Quest3 VR Teleoperator - Right Hand Mode
#
# Control mode: Single right hand (7D delta actions)
# Action format: [dx, dy, dz, d_roll, d_pitch, d_yaw, gripper]
# Units: position in meters, rotation in radians (same as robot expects)
# Compatible with: so101_sim.yaml (delta_ee mode), so101_ee.yaml
#
# Usage:
#   - Press and hold SQUEEZE button (side grip) to send pose deltas
#   - Use TRIGGER to control gripper (press = open, release = close)
#   - When SQUEEZE is released, no data is written to shared memory
#
# Note: VR tracking already outputs in meters/radians, scale=1.0 for direct pass-through

type: vlastudio.deploy.teleoperator.quest3.Quest3Teleop
name: quest3_teleop
args:
  name: quest3_teleop
  max_size_mb: 1
  fps: 100.0               # Match VR update rate (~72Hz)
  arm_mode: right          # Single right hand mode (7D output)
  position_scale: 5.0      # VR outputs meters, pass through directly
  rotation_scale: 4.0      # VR outputs radians, pass through directly
  connect_timeout: 60.0    # VR connection timeout in seconds
  gripper_default_closed: true  # Gripper closed by default
  gripper_delta_mode: true      # Use delta mode (incremental gripper control)
  gripper_delta_value: 0.1
  gripper_use_trigger: true
  gripper_a_maps_to_open: false
  gripper_b_maps_to_close: false
  
  # Single 3x3 transform matrix: Quest (LHS) -> AliciaD (RHS)
  # Handles both LHS->RHS conversion and axis remapping
  # Quest (LHS): X=front/back, Y=up/down, Z=left/right
  # AliciaD (RHS): X=left/right, Y=front/back, Z=up/down
  calibration_transform:
    - [0, 0, -1]   # AliciaD_X (left/right) = -Quest_Z
    - [-1, 0, 0]   # AliciaD_Y (front/back) = -Quest_X
    - [0, 1, 0]    # AliciaD_Z (up/down) = Quest_Y
  
  debug: false              # Set to true for debugging
