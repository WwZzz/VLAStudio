# Slider Teleop for Bimanual SO101 Delta EE Control
# 
# 14D action: [left_dx, left_dy, left_dz, left_droll, left_dpitch, left_dyaw, left_dgripper,
#              right_dx, right_dy, right_dz, right_droll, right_dpitch, right_dyaw, right_dgripper]
#
# Each arm has 7 DOF: 3D position + 3D rotation + gripper

type: vlastudio.deploy.teleoperator.tk_slider.SliderTeleop
name: slider_bi_so101_delta_ee
args:
  name: slider_bi_so101_delta_ee
  max_size_mb: 1
  fps: 100.0
  action_dim: 14
  slider_ranges:
    # Left arm (7D)
    - [-1.0, 1.0]    # left_dx (forward/back)
    - [-1.0, 1.0]    # left_dy (left/right)
    - [-1.0, 1.0]    # left_dz (up/down)
    - [-1.0, 1.0]    # left_droll
    - [-1.0, 1.0]    # left_dpitch
    - [-1.0, 1.0]    # left_dyaw
    - [-1.0, 1.0]    # left_dgripper
    # Right arm (7D)
    - [-1.0, 1.0]    # right_dx (forward/back)
    - [-1.0, 1.0]    # right_dy (left/right)
    - [-1.0, 1.0]    # right_dz (up/down)
    - [-1.0, 1.0]    # right_droll
    - [-1.0, 1.0]    # right_dpitch
    - [-1.0, 1.0]    # right_dyaw
    - [-1.0, 1.0]    # right_dgripper
  slider_labels:
    - "L-X (fwd/back)"
    - "L-Y (left/right)"
    - "L-Z (up/down)"
    - "L-Roll"
    - "L-Pitch"
    - "L-Yaw"
    - "L-Gripper"
    - "R-X (fwd/back)"
    - "R-Y (left/right)"
    - "R-Z (up/down)"
    - "R-Roll"
    - "R-Pitch"
    - "R-Yaw"
    - "R-Gripper"
