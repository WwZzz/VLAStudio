# Quest3 dual-arm — Relative EE (anchor) for BessicaSimRobot rel_ee
#
# Requires action_dict fields: unsqueeze_active, anchor_just_set,
# left_unsqueeze_active, right_unsqueeze_active (Quest3Teleop provides all).
#
# Usage:
#   vlastudio collect -r configs/robot/bessica_sim_rel_ee.yaml \
#     -t configs/teleop/quest3_bessica_rel_ee.yaml --visualize

type: vlastudio.deploy.teleoperator.quest3.Quest3Teleop
name: quest3_teleop
args:
  name: quest3_teleop
  max_size_mb: 1
  fps: 100.0
  arm_mode: dual
  mode: rel_ee
  position_scale: 1.0
  rotation_scale: 1.0
  connect_timeout: 60.0
  gripper_default_closed: true
  gripper_delta_mode: true
  gripper_delta_value: 0.1
  gripper_button_control: true

  # Quest controller local frame (right-handed): x=left+, y=back+, z=up+
  # Map to robot base semantic directions: left+, back+, up+
  calibration_transform:
    - [-1, 0, 0]
    - [0, 0, 1]
    - [0, 1, 0]

  debug: false
