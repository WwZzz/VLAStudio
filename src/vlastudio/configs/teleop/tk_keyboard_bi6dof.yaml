# Bimanual Keyboard Teleoperator for controlling two 6-DOF arms
#
# Uses a GUI window to capture keyboard events (works in subprocess)
# Outputs 14D delta action: [left_7D, right_7D]
# Each arm: [dx, dy, dz, d_roll, d_pitch, d_yaw, d_gripper]
# Units: position in meters, rotation in radians
#
# Key Mappings:
#
#   LEFT ARM (keyboard left half):
#     Translation:
#       Q/E : Forward/Backward (X)
#       D/A : Left/Right (Y)  
#       W/S : Up/Down (Z)
#     Rotation:
#       R/F : Roll +/-
#       1/3 : Pitch +/-
#       Z/C : Yaw +/-
#     Gripper:
#       V/B : Open/Close
#
#   RIGHT ARM (keyboard right half):
#     Translation:
#       U/O : Forward/Backward (X)
#       L/J : Left/Right (Y)
#       I/K : Up/Down (Z)
#     Rotation:
#       Y/H : Roll +/-
#       7/9 : Pitch +/-
#       N/M : Yaw +/-
#     Gripper:
#       ./  : Open/Close
#
#   Reset:
#     0   : Stop all motion
#
# Note: You must click on the GUI window to focus it before keyboard input works.

type: vlastudio.deploy.teleoperator.keyboard_bimanual.KeyboardBimanual
name: keyboard_bimanual
args:
  name: keyboard_bimanual
  max_size_mb: 1
  fps: 50.0
  # Output actual units: meters for position, radians for rotation
  trans_scale: 0.002   # Key press → 2mm per frame
  rot_scale: 0.01      # Key press → 0.01 rad (~0.57°) per frame
  gripper_scale: 0.01  # Gripper delta per frame
  debug: false
  
  # Custom key mappings for left arm (7D: X, Y, Z, Roll, Pitch, Yaw, Gripper)
  left_key_mappings:
    - {name: "L-X (fwd/back)", key_positive: "q", key_negative: "e", scale: 0.002}
    - {name: "L-Y (left/right)", key_positive: "a", key_negative: "d", scale: 0.002}
    - {name: "L-Z (up/down)", key_positive: "w", key_negative: "s", scale: 0.002}
    - {name: "L-Roll", key_positive: "r", key_negative: "f", scale: 0.01}
    - {name: "L-Pitch", key_positive: "1", key_negative: "3", scale: 0.01}
    - {name: "L-Yaw", key_positive: "z", key_negative: "x", scale: 0.01}
    - {name: "L-Gripper", key_positive: "c", key_negative: "v", scale: 0.01}
  
  # Custom key mappings for right arm (7D: X, Y, Z, Roll, Pitch, Yaw, Gripper)
  right_key_mappings:
    - {name: "R-X (fwd/back)", key_positive: "u", key_negative: "o", scale: 0.002}
    - {name: "R-Y (left/right)", key_positive: "j", key_negative: "l", scale: 0.002}
    - {name: "R-Z (up/down)", key_positive: "i", key_negative: "k", scale: 0.002}
    - {name: "R-Roll", key_positive: "y", key_negative: "h", scale: 0.01}
    - {name: "R-Pitch", key_positive: "7", key_negative: "9", scale: 0.01}
    - {name: "R-Yaw", key_positive: "n", key_negative: "m", scale: 0.01}
    - {name: "R-Gripper", key_positive: "comma", key_negative: "period", scale: 0.01}
