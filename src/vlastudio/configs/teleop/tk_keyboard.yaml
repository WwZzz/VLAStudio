# Keyboard Teleoperator - Generic configurable keyboard control
#
# Uses a GUI window to capture keyboard events (works in subprocess)
# Fully configurable key mappings and action dimensions.
#
# Example: 3D position control (X, Y, Z)
#
# Note: You must click on the GUI window to focus it before keyboard input works.

type: vlastudio.deploy.teleoperator.keyboard.Keyboard
name: keyboard
args:
  name: keyboard
  max_size_mb: 1
  fps: 50.0
  title: "Keyboard Control"
  reset_key: "0"
  debug: false
  
  # Define key mappings - each entry creates one action dimension
  # Format: {name: "Display Name", key_positive: "key", key_negative: "key", scale: 1.0}
  key_mappings:
    - {name: "X (forward/back)", key_positive: "w", key_negative: "s", scale: 1.0}
    - {name: "Y (left/right)", key_positive: "a", key_negative: "d", scale: 1.0}
    - {name: "Z (up/down)", key_positive: "r", key_negative: "f", scale: 1.0}
