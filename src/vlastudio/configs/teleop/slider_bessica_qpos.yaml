# Slider Teleop for Bessica-D dual-arm — qpos mode (16D)
#
# Action layout: [right_arm_joint1..7, right_gripper, left_arm_joint1..7, left_gripper]
# Arm slider range: [-2.14, 2.14] rad
# Gripper slider range: [0, 0.101] m = finger gap width (0=closed, 0.101=fully open)
#
# Use with: configs/robot/bessica_sim_qpos.yaml
# Run:
#   python collect_data.py -r configs/robot/bessica_sim_qpos.yaml -t configs/teleop/slider_bessica_qpos.yaml --visualize

type: vlastudio.deploy.teleoperator.tk_slider.SliderTeleop
name: slider_bessica_qpos
args:
  name: slider_bessica_qpos
  max_size_mb: 1
  fps: 50.0
  action_dim: 16
  initial_values:
    - 0.0
    - 0.0
    - -1.4
    - 1.55
    - 0.0
    - 0.0
    - 0.0
    - 0.101
    - 0.0
    - 0.0
    - -1.4
    - 1.55
    - 0.0
    - 0.0
    - 0.0
    - 0.101
  slider_ranges:
    # Right arm joints 1-7
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    # Right gripper (width in meters)
    - [0.0, 0.101]
    # Left arm joints 1-7
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    - [-2.14, 2.14]
    # Left gripper (width in meters)
    - [0.0, 0.101]
  slider_labels:
    - "R Joint1"
    - "R Joint2"
    - "R Joint3"
    - "R Joint4"
    - "R Joint5"
    - "R Joint6"
    - "R Joint7"
    - "R Gripper"
    - "L Joint1"
    - "L Joint2"
    - "L Joint3"
    - "L Joint4"
    - "L Joint5"
    - "L Joint6"
    - "L Joint7"
    - "L Gripper"
