# Keyboard Teleoperator for 6DOF + Gripper Control
#
# Uses a GUI window to capture keyboard events (works in subprocess)
# Outputs 7D delta action: [dx, dy, dz, d_roll, d_pitch, d_yaw, d_gripper]
# Units: position in meters, rotation in radians
#
# Key Mappings:
#   Translation:
#     Q/E : Forward/Backward (X)
#     A/D : Left/Right (Y)
#     W/S : Up/Down (Z)
#
#   Rotation:
#     R/F : Roll +/-
#     1/3 : Pitch +/-
#     Z/C : Yaw +/-
#
#   Gripper:
#     V   : Open
#     B   : Close
#
#   Reset:
#     0   : Stop all motion
#
# Note: You must click on the GUI window to focus it before keyboard input works.

type: vlastudio.deploy.teleoperator.keyboard_6dof.Keyboard6DOF
name: keyboard_6dof
args:
  name: keyboard_6dof
  max_size_mb: 1
  fps: 100.0
  # Output actual units: meters for position, radians for rotation
  trans_scale: 1.0     # Key press → 2mm per frame
  rot_scale: 1.0        # Key press → 0.01 rad (~0.57°) per frame
  gripper_scale: .1    # Gripper delta per frame
  debug: false
  
  # Custom key mappings
  key_mappings:
    - {name: "X (forward/back)", key_positive: "q", key_negative: "e", scale: 0.0015}
    - {name: "Y (left/right)", key_positive: "a", key_negative: "d", scale: 0.0015}
    - {name: "Z (up/down)", key_positive: "w", key_negative: "s", scale: 0.0015}
    - {name: "Roll", key_positive: "r", key_negative: "f", scale: 0.005}
    - {name: "Pitch", key_positive: "1", key_negative: "3", scale: 0.005}
    - {name: "Yaw", key_positive: "z", key_negative: "c", scale: 0.005}
    - {name: "Gripper", key_positive: "v", key_negative: "b", scale: 0.05}
