# Quest3 VR Teleoperator - Relative EE (Anchor) Mode for AliciaD
#
# Control mode: Single right hand with RELATIVE pose (7D actions)
# Action format: [rel_x, rel_y, rel_z, rel_roll, rel_pitch, rel_yaw, gripper]
# Compatible with: alicia_d_rel_ee.yaml (rel_ee mode)
#
# 右手：捏侧键时扳机 0~1 连续控夹爪（analog_travel，需新版 vr_app.js 读 gamepad.buttons[0].value）。
# 若只有 0/1：可改 gripper_trigger_mode: a_open_trigger_close 且 gripper_a_maps_to_open: true（A 张、扳机合）。
# B = 仅 go_home；A 默认不参与夹爪。freeze：不读扳机夹爪。

type: deploy.teleoperator.quest3.Quest3Teleop
name: quest3_teleop
args:
  name: quest3_teleop
  max_size_mb: 1
  fps: 30.0
  arm_mode: right
  mode: rel_ee
  position_scale: 1.0
  rotation_scale: 1.0
  connect_timeout: 180.0
  gripper_default_closed: true
  # Absolute open amount from trigger (needs robot gripper_absolute: true). No ramp delay.
  gripper_delta_mode: false
  gripper_delta_value: 0.25
  gripper_use_trigger: true
  gripper_trigger_mode: analog_travel
  gripper_trigger_analog_scale: 1.0
  gripper_trigger_analog_deadband: 0.06
  gripper_a_maps_to_open: false
  gripper_b_maps_to_close: false

  calibration_transform:
    - [0, 0, -1]
    - [-1, 0, 0]
    - [0, 1, 0]

  debug: false
  gripper_trace: false
  # Keep Quest display awake while headset is removed (needs adb + USB debugging).
  # Warns once if adb/device unavailable; set false to disable.
  keep_screen_awake: true
  keep_screen_awake_interval: 5.0
