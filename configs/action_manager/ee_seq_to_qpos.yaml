type: deploy.action_manager.ee_seq_to_qpos.EESequenceToQposManager
name: ee_seq_to_qpos
args:
  robot_shm_name: alicia_d
  # Same as offline --presolve-ee-to-qpos (no recorded joint prior)
  polish: true
  ik_eps: 0.05
  ik_max_iter: 80
  ik_rotation_weight: 0.1
  use_joint_prior: false
  # 1=policy rate; >1 densify in joint space after IK
  interp_factor: 1
  joint_interp: cubic
  max_joint_accel_deg_s2: 900

  # Post-IK joint denoise (main tip anti-jitter)
  joint_ema_alpha: 0.4
  joint_deadband_deg: 0.15

  # --- IK thrash safety (near-home / singularity) ---
  # Per-frame: hard-reject IK solutions that jump more than this from warmstart.
  max_ik_step_deg: 10.0
  # Chunk: if first frame jumps from current q more than this → HOLD current.
  max_q0_delta_deg: 20.0
  # Chunk: max consecutive frame Δq; larger mid-chunk steps are CLAMPed.
  max_chunk_dq_deg: 15.0
  # Chunk: HOLD if FK residual or IK fail count looks unhealthy.
  max_fk_err: 0.10
  max_ik_fails: 6
  ik_boost_after_holds: 2
  ik_boost_step: 40
  ik_max_iter_cap: 400
  ik_boost_retries: 2
  clamp_traj: true
