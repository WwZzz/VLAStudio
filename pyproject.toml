[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlastudio"
version = "0.2.0.dev0"
description = "Extensible robotics policy training and deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6,<7", "platformdirs>=4,<5", "filelock>=3.16,<4", "uv>=0.8,<1"]

[project.scripts]
vlastudio = "vlastudio.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlastudio"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**", "**/.ipynb_checkpoints/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/train.py", "/start_policy_server.py", "/eval_real.py", "/eval_sim.py", "/collect_data.py", "/README.md", "/README.legacy.md", "/LICENSE", "/pyproject.toml", "/tests/packaging", "/tests/gpu", "/examples", "/docs/package_runtime.md", "/docs/package_validation.md", "/docs/gpu_validation.json", "/requirements-legacy.txt", "/uv.lock"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**"]
