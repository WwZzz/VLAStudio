[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlastudio"
version = "0.2.0.dev0"
description = "Extensible robotics policy training and deployment"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["PyYAML>=6,<7", "platformdirs>=4,<5", "filelock>=3.16,<4", "uv>=0.8,<1"]

[project.scripts]
vlastudio = "vlastudio.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "hatchling"]
act = ["torch==2.4.0", "torchvision==0.19.0", "numpy==1.26.4", "transformers==4.45.2", "accelerate==1.0.1", "loguru==0.7.3", "h5py==3.12.1", "pillow==11.3.0", "opencv-python==4.9.0.80", "einops==0.8.1", "scipy==1.14.1", "timm==1.0.15", "torchdata==0.9.0", "matplotlib==3.9.4", "imageio==2.37.0", "imageio-ffmpeg==0.6.0", "websockets==13.1", "psutil==6.1.1", "tensorboardX==2.6.4", "protobuf==5.29.6"]
aloha = ["dm-control==1.0.34", "mujoco==3.3.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/vlastudio"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**", "**/.ipynb_checkpoints/**"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/train.py", "/start_policy_server.py", "/eval_real.py", "/eval_sim.py", "/collect_data.py", "/README.md", "/README.legacy.md", "/LICENSE", "/pyproject.toml", "/examples", "/docs/package_runtime.md", "/docs/package_validation.md", "/docs/gpu_validation.json", "/requirements-legacy.txt", "/uv.lock"]
exclude = ["**/.venv/**", "**/__pycache__/**", "**/.git/**"]
